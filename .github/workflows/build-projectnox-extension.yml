name: Build & Release Project Nox Extension

on:
  push:
    branches:
      - extensão
    paths:
      - 'extension-projectnox/**'
      - '.github/workflows/build-projectnox-extension.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build Extension APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 📦 Build debug APK
        working-directory: extension-projectnox
        run: gradle assembleDebug --no-daemon

      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: projectnox-extension-debug
          path: extension-projectnox/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 📦 Build release APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')
        working-directory: extension-projectnox
        run: gradle assembleRelease --no-daemon

      - name: 📤 Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: projectnox-extension-apk
          path: extension-projectnox/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

