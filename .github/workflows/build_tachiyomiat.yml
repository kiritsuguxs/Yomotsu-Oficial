name: Transfer verified Y22 recognizer
on:
  push:
    branches: ['agent/y22-ppocrv6-small-test1']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact uploaded model as a Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          data = b''.join(Path(f'.y22-model-upload/rec.part{i}').read_bytes() for i in range(2))
          assert len(data) == 21159378
          assert hashlib.sha256(data).hexdigest() == '5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634'
          request = urllib.request.Request(
              'https://api.github.com/repos/kiritsuguxs/Yomotsu-Oficial/git/blobs',
              data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          assert result['sha'] == '7c052944eb4f25cd3a38e4dbef8794430dc40f6b'
          print('Verified complete recognizer blob:', result['sha'])
          PY
