name: Compilar extensão manualmente

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch que contém a extensão
        required: true
        default: extensions
        type: string
      extension:
        description: Extensão para compilar
        required: true
        default: auto
        type: choice
        options:
          - auto
          - lycantoons
          - geasscomics
          - toonlivre
          - shadowmanga
          - tiamanhwa
          - megahentai
          - sexkomix
          - tankouhentai
          - bakai
          - hentaitokyo
          - blackoutcomics

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      TARGET_EXTENSION: ${{ inputs.extension }}
    steps:
      - name: Iniciar build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "extensions-build.yml",
              ref: process.env.TARGET_BRANCH,
              inputs: {
                extension: process.env.TARGET_EXTENSION,
              },
            });
            core.notice(`Build iniciado para ${process.env.TARGET_EXTENSION} em ${process.env.TARGET_BRANCH}.`);
